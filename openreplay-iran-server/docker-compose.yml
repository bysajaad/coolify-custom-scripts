  # ═══════════════════════════════════════════════════════════════════════════
  # NGINX  —  internal reverse proxy / Coolify entry point
  #
  # SERVICE_FQDN_NGINX  →  Coolify reads this and lets you set/edit your domain
  #                         from the service's Settings panel.
  # The upstream nginx.conf is generated by OpenReplay's install scripts; you
  # can mount a custom one via Coolify's File Mounts feature if needed.
  # ═══════════════════════════════════════════════════════════════════════════

  nginx-openreplay:
    image: nginx:stable-alpine
    environment:
      # SERVICE_FQDN_NGINX makes this service the Coolify proxy target and
      # exposes the domain field in the UI.
      - SERVICE_FQDN_NGINX
    depends_on:
      - frontend-openreplay
      - api-openreplay
      - http-openreplay
    networks:
      - openreplay-net
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        is_directory: false
        content: |
          # Minimal OpenReplay nginx config generated by Coolify template.
          # Replace with the full nginx.conf from OpenReplay's docker-compose
          # scripts directory for production use.
          upstream frontend  { server frontend-openreplay:9000; }
          upstream api       { server api-openreplay:8080; }
          upstream http      { server http-openreplay:9001; }
          upstream assist    { server assist-openreplay:9002; }
          upstream sourcemaps { server sourcemapreader-openreplay:9001; }

          server {
            listen 80;
            server_name _;

            # Static frontend
            location / {
              proxy_pass http://frontend;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            # REST API
            location /api {
              proxy_pass http://api;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Tracker ingest
            location /ingest {
              proxy_pass http://http;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            # WebSocket — live assist
            location /ws {
              proxy_pass http://assist;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "Upgrade";
              proxy_set_header Host $host;
            }

            # Source maps
            location /sourcemaps {
              proxy_pass http://sourcemaps;
              proxy_set_header Host $host;
            }
          }
    restart: unless-stopped

