# documentation: https://openreplay.com/docs
# slogan: Open-source session replay and product analytics you can self-host
# tags: session-replay,analytics,product-analytics,heatmaps,self-hosted,monitoring
# logo: svgs/openreplay.svg
# port: 80

# ════════════════════════════════════════════════════════════════════════════════
# OPENREPLAY  —  Coolify Service Template
# ════════════════════════════════════════════════════════════════════════════════
#
#  HOW IT WORKS
#  ┌─ Coolify reads this file and exposes all ${VAR} references in its UI.
#  ├─ SERVICE_PASSWORD_* / SERVICE_USER_* / SERVICE_BASE64_* are auto-generated.
#  ├─ SERVICE_FQDN_NGINX tells Coolify which container to route your domain to.
#  ├─ *-init services are one-shot containers (exclude_from_hc: true) that run
#  │   migrations/seeds on first deploy and never restart.
#  └─ Caddy is intentionally absent — Coolify's built-in proxy (Traefik/Caddy)
#      terminates TLS and forwards to nginx on port 80.
#
# ════════════════════════════════════════════════════════════════════════════════

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  postgresql:
    image: ghcr.io/openreplay/postgres:${POSTGRES_VERSION:-17}
    volumes:
      - pgdata:/bitnami/postgresql
    networks:
      openreplay-net:
        aliases:
          - postgresql.db.svc.cluster.local
    environment:
      # SERVICE_PASSWORD_POSTGRES is auto-generated by Coolify on first deploy
      - POSTGRESQL_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.11-alpine}
    volumes:
      - clickhouse:/var/lib/clickhouse
    networks:
      openreplay-net:
        aliases:
          - clickhouse-openreplay-clickhouse.db.svc.cluster.local
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: ghcr.io/openreplay/valkey:${REDIS_VERSION:-8}
    volumes:
      - redisdata:/data
    networks:
      openreplay-net:
        aliases:
          - redis-master.db.svc.cluster.local
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: rustfs/rustfs:${RUSTFS_VERSION:-2025}
    volumes:
      - miniodata:/data
    networks:
      openreplay-net:
        aliases:
          - minio.db.svc.cluster.local
    environment:
      # SERVICE_USER_MINIO and SERVICE_PASSWORD_MINIO are auto-generated
      - RUSTFS_ACCESS_KEY=${SERVICE_USER_MINIO}
      - RUSTFS_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_VOLUMES=/data
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/9000 2>/dev/null && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # ONE-SHOT INIT CONTAINERS
  # exclude_from_hc: true  →  Coolify won't count a clean exit as unhealthy.
  # restart: "no"          →  Never re-run after a successful exit.
  # ═══════════════════════════════════════════════════════════════════════════

  fs-permission-init:
    image: debian:stable-slim
    exclude_from_hc: true
    volumes:
      - shared-volume:/mnt/efs
      - miniodata:/mnt/minio
      - pgdata:/mnt/postgres
    entrypoint:
      - /bin/bash
      - -c
      - |
        chown -R 1001:1001 /mnt/efs /mnt/minio /mnt/postgres
        echo "[fs-permission-init] done"
    restart: "no"

  minio-init:
    image: minio/mc:latest
    exclude_from_hc: true
    depends_on:
      minio:
        condition: service_healthy
      fs-permission-init:
        condition: service_completed_successfully
    networks:
      - openreplay-net
    environment:
      - MINIO_HOST=http://minio.db.svc.cluster.local:9000
      - MINIO_ACCESS_KEY=${SERVICE_USER_MINIO}
      - MINIO_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        until mc alias set or "$MINIO_HOST" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" 2>/dev/null; do
          echo "Waiting for RustFS…"; sleep 2
        done
        for bucket in openreplay mobs-openreplay sessions-openreplay; do
          mc mb --ignore-existing "or/${bucket}"
          mc anonymous set download "or/${bucket}" || true
        done
        echo "[minio-init] done"
    restart: "no"

  db-init:
    image: ghcr.io/openreplay/postgres:${POSTGRES_VERSION:-17}
    exclude_from_hc: true
    depends_on:
      postgresql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - openreplay-net
    environment:
      - PGHOST=postgresql.db.svc.cluster.local
      - PGPORT=5432
      - PGDATABASE=postgres
      - PGUSER=postgres
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        until psql -c '\q' 2>/dev/null; do
          echo "Waiting for PostgreSQL…"; sleep 2
        done
        SQL=/docker-entrypoint-initdb.d/init_schema.sql
        [ -f "$SQL" ] && psql -v ON_ERROR_STOP=0 -f "$SQL" || true
        echo "[db-init] done"
    restart: "no"

  clickhouse-init:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.11-alpine}
    exclude_from_hc: true
    depends_on:
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - openreplay-net
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        until clickhouse-client \
              -h clickhouse-openreplay-clickhouse.db.svc.cluster.local \
              --port 9000 --query "SELECT 1" 2>/dev/null; do
          echo "Waiting for ClickHouse…"; sleep 2
        done
        echo "[clickhouse-init] done"
    restart: "no"

