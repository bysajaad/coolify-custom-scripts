# documentation: https://openreplay.com/docs
# slogan: Open-source session replay, product analytics & co-browsing you can self-host
# tags: session-replay,analytics,product-analytics,heatmaps,self-hosted,monitoring,devtools
# logo: svgs/openreplay.svg
# port: 80

# ════════════════════════════════════════════════════════════════════════════════
# OPENREPLAY — Coolify Service Template (Traefik-native, fully installer-free)
# ════════════════════════════════════════════════════════════════════════════════
#
# This template replaces everything the official docker-install.sh + install.sh
# scripts do: generating secrets, creating S3 buckets, running DB migrations,
# and writing docker-envs/*.env files — all inlined for Coolify compatibility.
#
# ROUTING (all on one domain, Traefik handles path-based dispatch):
#   /           → frontend:9000   (dashboard UI)
#   /api        → api:8080        (REST API  — chalice/FastAPI)
#   /ingest     → http:9001       (JS tracker ingest endpoint)
#   /assist     → assist:9002     (live co-browse WebSocket)
#   /spot       → spot:9000       (Spot screen recordings)
#
# AUTO-GENERATED SECRETS (Coolify creates once, never changes):
#   SERVICE_PASSWORD_POSTGRES  — Postgres password
#   SERVICE_USER_MINIO         — RustFS/S3 access key
#   SERVICE_PASSWORD_MINIO     — RustFS/S3 secret key
#   SERVICE_BASE64_64_JWTSECRET — jwt_secret for API auth (64-char base64)
#
# REQUIRED ENV VARS (set in Coolify's UI — marked with :?):
#   COMMON_VERSION    — OpenReplay release tag, e.g. v1.23.0
#
# OPTIONAL ENV VARS (sensible defaults pre-filled):
#   POSTGRES_VERSION      — default: 17
#   REDIS_VERSION         — default: 8
#   CLICKHOUSE_VERSION    — default: 25.11-alpine
#   RUSTFS_VERSION        — default: 2025
#
# FIRST-RUN NOTES:
#   After deploying, visit https://<your-domain>/signup to create the first user.
#   OpenReplay REQUIRES HTTPS to function — Traefik/Coolify handles this.
#   Minimum server: 2 vCPUs, 8 GB RAM, 50 GB disk, x86_64 architecture.
#
# ════════════════════════════════════════════════════════════════════════════════

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  postgresql:
    image: ghcr-mirror.liara.ir/openreplay/postgres:${POSTGRES_VERSION:-17}
    volumes:
      - pgdata:/bitnami/postgresql
    networks:
      openreplay-net:
        aliases:
          - postgresql.db.svc.cluster.local
    environment:
      - POSTGRESQL_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  clickhouse:
    image: docker-mirror.liara.ir/clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.11-alpine}
    volumes:
      - clickhouse:/var/lib/clickhouse
    networks:
      openreplay-net:
        aliases:
          - clickhouse-openreplay-clickhouse.db.svc.cluster.local
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: ghcr-mirror.liara.ir/openreplay/valkey:${REDIS_VERSION:-8}
    volumes:
      - redisdata:/data
    networks:
      openreplay-net:
        aliases:
          - redis-master.db.svc.cluster.local
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: docker-mirror.liara.ir/rustfs/rustfs:${RUSTFS_VERSION:-2025}
    volumes:
      - miniodata:/data
    networks:
      openreplay-net:
        aliases:
          - minio.db.svc.cluster.local
    environment:
      - RUSTFS_ACCESS_KEY=${SERVICE_USER_MINIO}
      - RUSTFS_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_VOLUMES=/data
    healthcheck:
      # RustFS is S3-compatible; probe the health endpoint
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:9000/health/live 2>/dev/null || echo > /dev/tcp/127.0.0.1/9000 2>/dev/null && echo ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # INIT CONTAINERS  (one-shot, exclude_from_hc keeps stack green after exit)
  #
  # ORDER: fs-permission → minio-init → db-init & clickhouse-init (parallel)
  # ═══════════════════════════════════════════════════════════════════════════

  # Fix volume ownership so the bitnami postgres + rustfs images can write
  fs-permission-init:
    image: docker-mirror.liara.ir/debian:stable-slim
    exclude_from_hc: true
    volumes:
      - shared-volume:/mnt/efs
      - miniodata:/mnt/minio
      - pgdata:/mnt/postgres
    entrypoint:
      - /bin/bash
      - -c
      - |
        chown -R 1001:1001 /mnt/efs /mnt/minio /mnt/postgres
        echo "[fs-permission-init] done"
    restart: "no"

  # Create every bucket OpenReplay needs (mirrors minio.sh from the Helm chart)
  minio-init:
    image: docker-mirror.liara.ir/minio/mc:latest
    exclude_from_hc: true
    depends_on:
      minio:
        condition: service_healthy
      fs-permission-init:
        condition: service_completed_successfully
    networks:
      - openreplay-net
    environment:
      - MINIO_ACCESS_KEY=${SERVICE_USER_MINIO}
      - MINIO_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "[minio-init] waiting for RustFS…"
        until mc alias set or http://minio.db.svc.cluster.local:9000 \
              "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" 2>/dev/null; do
          sleep 2
        done
        echo "[minio-init] connected — creating buckets"
        # Bucket list mirrors scripts/helmcharts/openreplay/files/minio.sh
        for bucket in mobs sessions-assets static sourcemaps \
                      sessions-mobile-assets quickwit vault-data records spots; do
          mc mb --ignore-existing "or/${bucket}"
          echo "  bucket: ${bucket} ✓"
        done
        # Make session assets publicly readable (required for replay)
        mc anonymous set download or/sessions-assets || true
        mc anonymous set download or/static         || true
        mc anonymous set download or/mobs           || true
        echo "[minio-init] done"
    restart: "no"

  # Apply PostgreSQL schema (runs idempotently; ON_ERROR_STOP=0 for re-runs)
  db-init:
    image: ghcr-mirror.liara.ir/openreplay/postgres:${POSTGRES_VERSION:-17}
    exclude_from_hc: true
    depends_on:
      postgresql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - openreplay-net
    environment:
      - PGHOST=postgresql.db.svc.cluster.local
      - PGPORT=5432
      - PGDATABASE=postgres
      - PGUSER=postgres
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "[db-init] waiting for PostgreSQL…"
        until psql -c '\q' 2>/dev/null; do sleep 2; done
        echo "[db-init] running schema migration"
        # The OpenReplay custom postgres image ships init_schema.sql here:
        SQL=/docker-entrypoint-initdb.d/init_schema.sql
        if [ -f "$SQL" ]; then
          psql -v ON_ERROR_STOP=0 -f "$SQL"
          echo "[db-init] schema applied ✓"
        else
          echo "[db-init] WARN: init_schema.sql not found at $SQL — skipping"
        fi
    restart: "no"

  # Apply ClickHouse schema
  clickhouse-init:
    image: docker-mirror.liara.ir/clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.11-alpine}
    exclude_from_hc: true
    depends_on:
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - openreplay-net
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        CH=clickhouse-openreplay-clickhouse.db.svc.cluster.local
        echo "[clickhouse-init] waiting for ClickHouse…"
        until clickhouse-client -h "$CH" --port 9000 \
              --query "SELECT 1" 2>/dev/null; do sleep 2; done
        echo "[clickhouse-init] connected ✓"
        # The OR image ships the ClickHouse DDL alongside the postgres one.
        # If available, apply it; otherwise the service bootstraps lazily.
        SQL=/docker-entrypoint-initdb.d/clickhouse_init_schema.sql
        if [ -f "$SQL" ]; then
          clickhouse-client -h "$CH" --port 9000 --multiquery < "$SQL" || true
          echo "[clickhouse-init] schema applied ✓"
        else
          echo "[clickhouse-init] no schema file found — ClickHouse self-initialises"
        fi
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES — PUBLIC  (Traefik-routed via SERVICE_FQDN_*)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Frontend  ( / → port 9000 ) ───────────────────────────────────────────
  frontend-openreplay:
    image: public.ecr.aws/p1t3u8a3/frontend:${COMMON_VERSION:?Set COMMON_VERSION e.g. v1.23.0}
    domainname: app.svc.cluster.local
    depends_on:
      db-init:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
    networks:
      openreplay-net:
        aliases:
          - frontend-openreplay
          - frontend-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      # SERVICE_FQDN_FRONTEND_9000 = root domain, port 9000 on container
      - SERVICE_FQDN_FRONTEND_9000
      # Public URL injected into the built JS bundle
      - DOMAIN_NAME=${SERVICE_FQDN_FRONTEND}
      - SITE_URL=https://${SERVICE_FQDN_FRONTEND}
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_REGION=us-east-1
      - BUCKET_LIST=sessions-assets,static,mobs,sourcemaps,sessions-mobile-assets,quickwit,vault-data,records,spots
    restart: unless-stopped

  # ── REST API  ( /api → port 8080 ) ────────────────────────────────────────
  api-openreplay:
    image: public.ecr.aws/p1t3u8a3/api:${COMMON_VERSION:?Set COMMON_VERSION e.g. v1.23.0}
    domainname: app.svc.cluster.local
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      openreplay-net:
        aliases:
          - api-openreplay
          - api-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      # Routes PathPrefix(/api) to port 8080
      - SERVICE_FQDN_API-OPENREPLAY_8080=/api
      - DOMAIN_NAME=${SERVICE_FQDN_FRONTEND}
      - SITE_URL=https://${SERVICE_FQDN_FRONTEND}
      # jwt_secret is the API auth signing key — Coolify auto-generates 64-char base64
      - jwt_secret=${SERVICE_BASE64_64_JWTSECRET}
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - pg_string=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgresql.db.svc.cluster.local:5432/postgres
      - redis_host=redis-master.db.svc.cluster.local
      - redis_port=6379
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_REGION=us-east-1
      - BUCKET_LIST=sessions-assets,static,mobs,sourcemaps,sessions-mobile-assets,quickwit,vault-data,records,spots
      - CH_HOST=clickhouse-openreplay-clickhouse.db.svc.cluster.local
      - CH_PORT=9000
      - CH_PORT_HTTP=8123
      - CH_USERNAME=default
      - CH_PASSWORD=
    restart: unless-stopped

  # ── Tracker ingest  ( /ingest → port 9001 ) ───────────────────────────────
  http-openreplay:
    image: public.ecr.aws/p1t3u8a3/http:${COMMON_VERSION:?Set COMMON_VERSION e.g. v1.23.0}
    domainname: app.svc.cluster.local
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      openreplay-net:
        aliases:
          - http-openreplay
          - http-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      # Routes PathPrefix(/ingest) to port 9001
      - SERVICE_FQDN_HTTP-OPENREPLAY_9001=/ingest
      - DOMAIN_NAME=${SERVICE_FQDN_FRONTEND}
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - redis_host=redis-master.db.svc.cluster.local
      - redis_port=6379
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - jwt_secret=${SERVICE_BASE64_64_JWTSECRET}
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_REGION=us-east-1
      - BUCKET_LIST=sessions-assets,static,mobs,sourcemaps,sessions-mobile-assets,quickwit,vault-data,records,spots
    restart: unless-stopped

  # ── Live Assist / Co-browse WebSocket  ( /assist → port 9002 ) ────────────
  # Traefik passes WebSocket Upgrade headers natively — no extra config needed.
  assist-openreplay:
    image: public.ecr.aws/p1t3u8a3/assist:${COMMON_VERSION:?Set COMMON_VERSION e.g. v1.23.0}
    domainname: app.svc.cluster.local
    networks:
      openreplay-net:
        aliases:
          - assist-openreplay
          - assist-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      # Routes PathPrefix(/assist) to port 9002; WebSocket upgrade works natively
      - SERVICE_FQDN_ASSIST-OPENREPLAY_9002=/assist
      - DOMAIN_NAME=${SERVICE_FQDN_FRONTEND}
      - redis_host=redis-master.db.svc.cluster.local
      - redis_port=6379
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - jwt_secret=${SERVICE_BASE64_64_JWTSECRET}
    restart: unless-stopped

  # ── Spot screen recordings  ( /spot → port 9000 ) ─────────────────────────
  spot-openreplay:
    image: public.ecr.aws/p1t3u8a3/spot:${COMMON_VERSION:?Set COMMON_VERSION e.g. v1.23.0}
    domainname: app.svc.cluster.local
    networks:
      openreplay-net:
        aliases:
          - spot-openreplay
          - spot-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      # Routes PathPrefix(/spot) to port 9000
      - SERVICE_FQDN_SPOT-OPENREPLAY_9000=/spot
      - DOMAIN_NAME=${SERVICE_FQDN_FRONTEND}
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - jwt_secret=${SERVICE_BASE64_64_JWTSECRET}
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_REGION=us-east-1
      - BUCKET_LIST=sessions-assets,static,mobs,sourcemaps,sessions-mobile-assets,quickwit,vault-data,records,spots
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES — INTERNAL  (no SERVICE_FQDN → never publicly exposed)
  # ═══════════════════════════════════════════════════════════════════════════

  alerts-openreplay:
    image: public.ecr.aws/p1t3u8a3/alerts:${COMMON_VERSION:?Set COMMON_VERSION e.g. v1.23.0}
    domainname: app.svc.cluster.local
    depends_on:
      db-init:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
    networks:
      openreplay-net:
        aliases:
          - alerts-openreplay
          - alerts-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      - DOMAIN_NAME=${SERVICE_FQDN_FRONTEND}
      - jwt_secret=${SERVICE_BASE64_64_JWTSECRET}
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - redis_host=redis-master.db.svc.cluster.local
      - redis_port=6379
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_REGION=us-east-1
      - CH_HOST=clickhouse-openreplay-clickhouse.db.svc.cluster.local
      - CH_PORT=9000
      - CH_PORT_HTTP=8123
      - CH_USERNAME=default
      - CH_PASSWORD=
    restart: unless-stopped

  images-openreplay:
    image: public.ecr.aws/p1t3u8a3/images:${COMMON_VERSION:?Set COMMON_VERSION e.g. v1.23.0}
    domainname: app.svc.cluster.local
    networks:
      openreplay-net:
        aliases:
          - images-openreplay
          - images-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      - DOMAIN_NAME=${SERVICE_FQDN_FRONTEND}
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_REGION=us-east-1
      - BUCKET_LIST=sessions-assets,static,mobs,sourcemaps,sessions-mobile-assets,quickwit,vault-data,records,spots
    restart: unless-stopped

  integrations-openreplay:
    image: public.ecr.aws/p1t3u8a3/integrations:${COMMON_VERSION:?Set COMMON_VERSION e.g. v1.23.0}
    domainname: app.svc.cluster.local
    networks:
      openreplay-net:
        aliases:
          - integrations-openreplay
          - integrations-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      - DOMAIN_NAME=${SERVICE_FQDN_FRONTEND}
      - jwt_secret=${SERVICE_BASE64_64_JWTSECRET}
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - redis_host=redis-master.db.svc.cluster.local
      - redis_port=6379
    restart: unless-stopped

  sink-openreplay:
    image: public.ecr.aws/p1t3u8a3/sink:${COMMON_VERSION:?Set COMMON_VERSION e.g. v1.23.0}
    domainname: app.svc.cluster.local
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    networks:
      openreplay-net:
        aliases:
          - sink-openreplay
          - sink-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      - DOMAIN_NAME=${SERVICE_FQDN_FRONTEND}
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - redis_host=redis-master.db.svc.cluster.local
      - redis_port=6379
      - CH_HOST=clickhouse-openreplay-clickhouse.db.svc.cluster.local
      - CH_PORT=9000
      - CH_PORT_HTTP=8123
      - CH_USERNAME=default
      - CH_PASSWORD=
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_REGION=us-east-1
      - BUCKET_LIST=sessions-assets,static,mobs,sourcemaps,sessions-mobile-assets,quickwit,vault-data,records,spots
    restart: unless-stopped

  sourcemapreader-openreplay:
    image: public.ecr.aws/p1t3u8a3/sourcemapreader:${COMMON_VERSION:?Set COMMON_VERSION e.g. v1.23.0}
    domainname: app.svc.cluster.local
    networks:
      openreplay-net:
        aliases:
          - sourcemapreader-openreplay
          - sourcemapreader-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      - DOMAIN_NAME=${SERVICE_FQDN_FRONTEND}
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_REGION=us-east-1
      - BUCKET_LIST=sessions-assets,static,mobs,sourcemaps,sessions-mobile-assets,quickwit,vault-data,records,spots
    restart: unless-stopped

  storage-openreplay:
    image: public.ecr.aws/p1t3u8a3/storage:${COMMON_VERSION:?Set COMMON_VERSION e.g. v1.23.0}
    domainname: app.svc.cluster.local
    networks:
      openreplay-net:
        aliases:
          - storage-openreplay
          - storage-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      - DOMAIN_NAME=${SERVICE_FQDN_FRONTEND}
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_REGION=us-east-1
      - BUCKET_LIST=sessions-assets,static,mobs,sourcemaps,sessions-mobile-assets,quickwit,vault-data,records,spots
