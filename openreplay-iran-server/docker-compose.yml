# documentation: https://openreplay.com/docs
# slogan: Open-source session replay, product analytics & co-browsing you can self-host
# tags: session-replay,analytics,product-analytics,heatmaps,self-hosted,monitoring,devtools
# logo: svgs/openreplay.svg
# port: 80

# ════════════════════════════════════════════════════════════════════════════════
# OPENREPLAY — Coolify Service Template (Traefik-native, no nginx)
# ════════════════════════════════════════════════════════════════════════════════
#
# ROUTING ARCHITECTURE (all under one domain via Traefik path rules):
#
#   SERVICE_FQDN_FRONTEND        → /          → frontend:9000  (UI)
#   SERVICE_FQDN_API=/api        → /api       → api:8080       (REST API)
#   SERVICE_FQDN_INGEST=/ingest  → /ingest    → http:9001      (tracker ingest)
#   SERVICE_FQDN_ASSIST=/assist  → /assist    → assist:9002    (co-browse WS)
#   SERVICE_FQDN_SPOT=/spot      → /spot      → spot:9000      (Spot recordings)
#
#   All five FQDN magic vars resolve to the SAME domain — Coolify de-dupes them
#   when the user sets their domain on the service stack settings page.
#   Traefik then matches the correct container by PathPrefix.
#
# INIT SEQUENCE (one-shot, exclude_from_hc: true):
#   fs-permission-init → minio-init → db-init + clickhouse-init → app services
#
# GENERATED SECRETS (never type these — Coolify creates them once and reuses):
#   SERVICE_PASSWORD_POSTGRES  ← PostgreSQL password
#   SERVICE_USER_MINIO         ← RustFS/MinIO access key
#   SERVICE_PASSWORD_MINIO     ← RustFS/MinIO secret key
#
# ════════════════════════════════════════════════════════════════════════════════

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE — Postgres · ClickHouse · Redis · RustFS (S3)
  # These are internal-only; no SERVICE_FQDN/URL declared → not exposed publicly
  # ═══════════════════════════════════════════════════════════════════════════

  postgresql:
    image: ghcr-mirror.liara.ir/openreplay/postgres:${POSTGRES_VERSION:-17}
    volumes:
      - pgdata:/bitnami/postgresql
    networks:
      openreplay-net:
        aliases:
          - postgresql.db.svc.cluster.local
    environment:
      - POSTGRESQL_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  clickhouse:
    image: docker-mirror.liara.ir/clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.11-alpine}
    volumes:
      - clickhouse:/var/lib/clickhouse
    networks:
      openreplay-net:
        aliases:
          - clickhouse-openreplay-clickhouse.db.svc.cluster.local
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: ghcr-mirror.liara.ir/openreplay/valkey:${REDIS_VERSION:-8}
    volumes:
      - redisdata:/data
    networks:
      openreplay-net:
        aliases:
          - redis-master.db.svc.cluster.local
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: docker-mirror.liara.ir/rustfs/rustfs:${RUSTFS_VERSION:-2025}
    volumes:
      - miniodata:/data
    networks:
      openreplay-net:
        aliases:
          - minio.db.svc.cluster.local
    environment:
      - RUSTFS_ACCESS_KEY=${SERVICE_USER_MINIO}
      - RUSTFS_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_VOLUMES=/data
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/9000 2>/dev/null && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # ONE-SHOT INIT CONTAINERS
  # exclude_from_hc: true  → Coolify ignores their exit, won't mark stack unhealthy
  # restart: "no"          → run once and done
  # ═══════════════════════════════════════════════════════════════════════════

  fs-permission-init:
    image: docker-mirror.liara.ir/debian:stable-slim
    exclude_from_hc: true
    volumes:
      - shared-volume:/mnt/efs
      - miniodata:/mnt/minio
      - pgdata:/mnt/postgres
    entrypoint:
      - /bin/bash
      - -c
      - |
        chown -R 1001:1001 /mnt/efs /mnt/minio /mnt/postgres
        echo "[fs-permission-init] done"
    restart: "no"

  minio-init:
    image: docker-mirror.liara.ir/minio/mc:latest
    exclude_from_hc: true
    depends_on:
      minio:
        condition: service_healthy
      fs-permission-init:
        condition: service_completed_successfully
    networks:
      - openreplay-net
    environment:
      - MINIO_ACCESS_KEY=${SERVICE_USER_MINIO}
      - MINIO_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        until mc alias set or http://minio.db.svc.cluster.local:9000 \
              "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" 2>/dev/null; do
          echo "Waiting for RustFS…"; sleep 2
        done
        for bucket in openreplay mobs-openreplay sessions-openreplay; do
          mc mb --ignore-existing "or/${bucket}"
          mc anonymous set download "or/${bucket}" || true
        done
        echo "[minio-init] done"
    restart: "no"

  db-init:
    image: ghcr-mirror.liara.ir/openreplay/postgres:${POSTGRES_VERSION:-17}
    exclude_from_hc: true
    depends_on:
      postgresql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - openreplay-net
    environment:
      - PGHOST=postgresql.db.svc.cluster.local
      - PGPORT=5432
      - PGDATABASE=postgres
      - PGUSER=postgres
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        until psql -c '\q' 2>/dev/null; do
          echo "Waiting for PostgreSQL…"; sleep 2
        done
        SQL=/docker-entrypoint-initdb.d/init_schema.sql
        [ -f "$SQL" ] && psql -v ON_ERROR_STOP=0 -f "$SQL" || true
        echo "[db-init] done"
    restart: "no"

  clickhouse-init:
    image: docker-mirror.liara.ir/clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.11-alpine}
    exclude_from_hc: true
    depends_on:
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - openreplay-net
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        until clickhouse-client \
              -h clickhouse-openreplay-clickhouse.db.svc.cluster.local \
              --port 9000 --query "SELECT 1" 2>/dev/null; do
          echo "Waiting for ClickHouse…"; sleep 2
        done
        echo "[clickhouse-init] done"
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES — PUBLIC (routed by Traefik via SERVICE_FQDN_*)
  #
  # Coolify reads SERVICE_FQDN_<ID>[=/path][_port] and:
  #   1. Creates a Traefik router with Host(`<your-domain>`) && PathPrefix(`/path`)
  #   2. Points that router to port <port> on the container
  #   3. Issues / renews the TLS cert automatically
  #
  # All five entries below share the same base domain — Coolify dedups the Host.
  # The user only sets the domain once in the service stack settings panel.
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Frontend UI  ( / ) ────────────────────────────────────────────────────
  frontend-openreplay:
    image: public.ecr.aws/p1t3u8a3/frontend:${COMMON_VERSION:-v1.23.0}
    domainname: app.svc.cluster.local
    depends_on:
      db-init:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
    networks:
      openreplay-net:
        aliases:
          - frontend-openreplay
          - frontend-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      # SERVICE_FQDN_FRONTEND with no path = root / → routes port 9000 to /
      - SERVICE_FQDN_FRONTEND_9000
      # Let the frontend know its own public URL
      - SITE_URL=${SERVICE_FQDN_FRONTEND}
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
    restart: unless-stopped

  # ── REST API  ( /api ) ────────────────────────────────────────────────────
  api-openreplay:
    image: public.ecr.aws/p1t3u8a3/api:${COMMON_VERSION:-v1.23.0}
    domainname: app.svc.cluster.local
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      openreplay-net:
        aliases:
          - api-openreplay
          - api-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      # Routes Host(`domain`) && PathPrefix(`/api`) → port 8080
      - SERVICE_FQDN_API-OPENREPLAY_8080=/api
      - SITE_URL=${SERVICE_FQDN_FRONTEND}
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - redis_host=redis-master.db.svc.cluster.local
      - redis_port=6379
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_BUCKET_PREFIX=openreplay
      - S3_REGION=us-east-1
      - CH_HOST=clickhouse-openreplay-clickhouse.db.svc.cluster.local
      - CH_PORT=9000
      - CH_PORT_HTTP=8123
    restart: unless-stopped

  # ── Tracker ingest  ( /ingest ) ───────────────────────────────────────────
  http-openreplay:
    image: public.ecr.aws/p1t3u8a3/http:${COMMON_VERSION:-v1.23.0}
    domainname: app.svc.cluster.local
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      openreplay-net:
        aliases:
          - http-openreplay
          - http-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      # Routes Host(`domain`) && PathPrefix(`/ingest`) → port 9001
      - SERVICE_FQDN_HTTP-OPENREPLAY_9001=/ingest
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - redis_host=redis-master.db.svc.cluster.local
      - redis_port=6379
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_BUCKET_PREFIX=openreplay
      - S3_REGION=us-east-1
    restart: unless-stopped

  # ── Live Assist / WebSocket  ( /assist ) ──────────────────────────────────
  # Traefik handles WebSocket upgrades natively — no extra config needed.
  assist-openreplay:
    image: public.ecr.aws/p1t3u8a3/assist:${COMMON_VERSION:-v1.23.0}
    domainname: app.svc.cluster.local
    networks:
      openreplay-net:
        aliases:
          - assist-openreplay
          - assist-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      # Routes Host(`domain`) && PathPrefix(`/assist`) → port 9002
      # Traefik forwards WS upgrade headers automatically
      - SERVICE_FQDN_ASSIST-OPENREPLAY_9002=/assist
      - redis_host=redis-master.db.svc.cluster.local
      - redis_port=6379
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
    restart: unless-stopped

  # ── Spot recordings  ( /spot ) ────────────────────────────────────────────
  spot-openreplay:
    image: public.ecr.aws/p1t3u8a3/spot:${COMMON_VERSION:-v1.23.0}
    domainname: app.svc.cluster.local
    networks:
      openreplay-net:
        aliases:
          - spot-openreplay
          - spot-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    environment:
      # Routes Host(`domain`) && PathPrefix(`/spot`) → port 9000
      - SERVICE_FQDN_SPOT-OPENREPLAY_9000=/spot
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - S3_BUCKET_PREFIX=openreplay
      - S3_REGION=us-east-1
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES — INTERNAL ONLY
  # No SERVICE_FQDN/URL → Traefik never touches them → not publicly reachable
  # ═══════════════════════════════════════════════════════════════════════════

  alerts-openreplay:
    image: public.ecr.aws/p1t3u8a3/alerts:${COMMON_VERSION:-v1.23.0}
    domainname: app.svc.cluster.local
    depends_on:
      db-init:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
